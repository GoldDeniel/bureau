<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau — agents at work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230f1118'/%3E%3Crect x='11' y='15' width='10' height='34' rx='3.5' fill='%237c9cff'/%3E%3Crect x='27' y='15' width='10' height='22' rx='3.5' fill='%235f7bff'/%3E%3Crect x='43' y='15' width='10' height='29' rx='3.5' fill='%234a5fd6'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0b0f; --panel:#101218; --panel2:#151824; --line:#232838;
    --txt:#e7e9f0; --mut:#8b93a8; --dim:#5d6579;
    --acc:#7c9cff; --acc2:#a78bfa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --pink:#f472b6;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 85% -10%, rgba(124,156,255,.10), transparent 60%),
      radial-gradient(700px 400px at 0% 100%, rgba(167,139,250,.07), transparent 60%);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:var(--acc)}
  ::selection{background:rgba(124,156,255,.3)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a3040;border-radius:10px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}

  /* ---------- rail ---------- */
  .rail{
    display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;
    border-right:1px solid var(--line);background:rgba(13,15,21,.7);
    backdrop-filter:blur(8px);overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;letter-spacing:.2px}
  .brand .mark{
    width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;
    background:linear-gradient(140deg,var(--acc),var(--acc2));color:#0b0c10;
    box-shadow:0 0 22px rgba(124,156,255,.45);
  }
  .brand .ver{color:var(--dim);font-size:10px;font-weight:500;margin-left:auto}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);font-size:12.5px;transition:.15s;
  }
  .btn:hover{background:#1c2130;border-color:#2e3650;transform:translateY(-1px)}
  .btn:active{transform:none}
  .btn.primary{
    background:linear-gradient(135deg,var(--acc),#6d8bfa);border-color:transparent;color:#0a0b0f;
    font-weight:650;box-shadow:0 6px 18px rgba(124,156,255,.25);
  }
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent}
  .btn.small{padding:5px 8px;font-size:11.5px;border-radius:7px}
  .btn.danger{color:#ffb4b4;border-color:#40232a;background:#1d1417}
  .rail-label{
    display:flex;align-items:center;justify-content:space-between;
    color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;
    margin:4px 4px -6px;
  }
  .rail-label button{color:var(--mut);font-size:15px;line-height:1;padding:0 2px}
  .rail-label button:hover{color:var(--acc)}
  nav.divs{display:flex;flex-direction:column;gap:2px}
  .divlink.paused .nm{opacity:.55}
  .pause-tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:1px 4px;border-radius:3px;background:rgba(255,193,94,.18);color:#ffc15e;vertical-align:middle}
  .divlink{
    display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;
    color:var(--mut);text-align:left;font-size:12.5px;transition:.12s;
  }
  .divlink:hover{background:#171b26;color:var(--txt)}
  .divlink.active{background:#1a2032;color:var(--txt);box-shadow:inset 2px 0 0 var(--acc)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
  .dot.c1{background:#7c9cff}.dot.c2{background:#f472b6}.dot.c3{background:#4ade80}
  .dot.c4{background:#fbbf24}.dot.c5{background:#a78bfa}.dot.c6{background:#22d3ee}
  .divlink .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cnt{
    font-size:10.5px;color:var(--dim);background:#171b26;border:1px solid var(--line);
    padding:0 6px;border-radius:20px;min-width:20px;text-align:center;
  }
  .cnt.hot{color:#dbe4ff;background:#1c2440;border-color:#2c3a63}
  .agents-mini{display:flex;flex-direction:column;gap:5px}
  .agent-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);padding:2px 4px}
  .agent-row .slug{color:var(--txt);font-family:ui-monospace,monospace;font-size:11px}
  .agent-row .ad{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--line);padding:0 5px;border-radius:5px}
  .agent-row .prof{font-size:9.5px;color:#b8c4e0;border:1px solid #2c3752;background:#151b29;padding:0 5px;border-radius:5px;white-space:nowrap}
  .agent-row .sel{font-size:9.5px;color:#9fb0d8;border:1px solid #2c3752;background:#111726;padding:0 5px;border-radius:5px;white-space:nowrap}
  .agent-row[data-agent]{cursor:pointer;border-radius:6px}
  .agent-row[data-agent]:hover{background:#141a27}
  .st{width:6px;height:6px;border-radius:50%;background:#3a4152;flex:none}
  .st.running{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.2s infinite}
  .st.idle{background:#4b556b}
  @keyframes pulse{50%{opacity:.35}}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
  .foot-note{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between}

  /* ---------- main ---------- */
  main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{
    display:flex;align-items:center;gap:16px;padding:18px 22px 14px;border-bottom:1px solid var(--line);
  }
  .topbar h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.1px}
  .topbar p{margin:2px 0 0;color:var(--mut);font-size:11.5px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

  /* ---------- live strip ---------- */
  .livebar{display:flex;align-items:center;gap:6px;padding:4px 22px;border-bottom:1px solid var(--line);background:#0f121a;flex-wrap:wrap;min-height:30px}
  .livebar .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .live-chip{display:flex;align-items:center;gap:6px;flex:0 0 auto;background:#141926;border:1px solid #232b3d;border-radius:20px;padding:1px 8px;font-size:11px;line-height:1.45;color:var(--txt);cursor:pointer;font:inherit}
  .live-chip:hover{border-color:#33405c;background:#172033}
  .live-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.2s infinite}
  .live-chip .who{font-family:ui-monospace,monospace;color:#a9b6d6;white-space:nowrap}
  .live-chip .ref{color:#dbe4ff;font-family:ui-monospace,monospace}
  .live-chip .t{color:var(--dim);font-variant-numeric:tabular-nums}
  .live-chip .n{font-size:10px;color:var(--mut);background:#1b2130;border:1px solid #28324a;border-radius:20px;padding:0 6px}
  .live-idle{font-size:11.5px;color:var(--dim)}
  .live-procs{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:320px;overflow:auto}
  .live-proc{display:grid;grid-template-columns:52px 52px 1fr;gap:8px;align-items:baseline;font-size:11px;background:#12151d;border:1px solid var(--line);border-radius:7px;padding:5px 8px}
  .live-proc .pid{color:var(--dim);font-family:ui-monospace,monospace}
  .live-proc .secs{color:var(--mut);font-variant-numeric:tabular-nums}
  .live-proc code{font-size:10.5px;color:#c7d2e8;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,monospace}
  .search{
    display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:0 9px;height:32px;width:210px;
  }
  .search input{background:none;border:none;outline:none;width:100%;font-size:12px}
  .search span{color:var(--dim);font-size:12px}
  .kbd{font-size:10px;color:var(--dim);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

  .board{
    display:flex;gap:14px;padding:16px 22px 22px;overflow-x:auto;overflow-y:hidden;flex:1;align-items:stretch;
  }
  .col{
    flex:1 1 210px;min-width:210px;max-width:360px;display:flex;flex-direction:column;max-height:100%;
    background:rgba(16,18,24,.55);border:1px solid var(--line);border-radius:var(--r);
  }
  .col-head{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}
  .col-head .t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:600}
  .col-head .n{font-size:10.5px;color:var(--dim);margin-left:auto;background:#171b26;border-radius:20px;padding:0 6px}
  .col.new .col-head .t{color:#9db4ff}
  .col.review .col-head .t{color:#fcd34d}
  .col-head .n.sub{color:#94a3b8;font-size:11px;margin-left:4px}
  .col.done .col-head .t{color:#6ee7a0}
  .col.attention .col-head .t{color:#fca5a5}
  .cards{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:40px;flex:1}
  .card{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;
    cursor:pointer;transition:.13s;position:relative;
  }
  .card:hover{border-color:#33405f;transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .card .ref{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);letter-spacing:.02em}
  .card .ttl{margin:3px 0 7px;font-size:12.5px;line-height:1.4;color:#e9ecf5}
  .card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pill{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--mut);background:#12151e;white-space:nowrap}
  .pill.p0{color:#ffb4b4;border-color:#4a2730;background:#1e1215}
  .pill.p1{color:#fcd34d;border-color:#453a1d;background:#1d1a10}
  .pill.p3,.pill.p4{color:#93a4c9}
  .pill.who{color:#b9c6f5;border-color:#2b3550;background:#161b2a;font-family:ui-monospace,monospace;font-size:9.5px}
  .pill.sub{color:#d8b4fe;border-color:#3b2a52;background:#1a1526}
  .pill.ok{color:#86efac;border-color:#234132;background:#101d16}
  .card .subs{margin-top:7px;padding-top:6px;border-top:1px dashed #242a3a;display:flex;flex-direction:column;gap:2px}
  .card .subs div{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .subs b{font-family:ui-monospace,monospace;font-weight:400;color:#6b7694}
  .card.done{opacity:.55}
  .card.blocked{border-color:#3a2529}
  .empty{color:#4d566b;font-size:11px;text-align:center;padding:16px 8px;border:1px dashed #232838;border-radius:8px}

  /* ---------- drawer ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(4,5,8,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .backdrop.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:720px;max-width:98vw;z-index:50;
    background:#0e1016;border-left:1px solid var(--line);transform:translateX(102%);
    transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;
    box-shadow:-30px 0 60px rgba(0,0,0,.45);
  }
  .drawer.show{transform:none}
  body.dragging{cursor:col-resize;user-select:none}
  body.dragging .drawer{transition:none}
  .grip{position:absolute;left:-3px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3}
  .grip::after{content:"";position:absolute;left:4px;top:50%;margin-top:-24px;width:3px;height:48px;border-radius:3px;background:rgba(255,255,255,.10);transition:background .15s}
  .grip:hover::after{background:var(--acc)}
  .dr-body .term{flex:0 0 auto;height:auto;min-height:260px;max-height:min(58vh,660px);margin:0 -20px;border-left:none;border-right:none;border-radius:0;padding:11px 20px}
  .dr-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .dr-head .ref{font-family:ui-monospace,monospace;font-size:11px;color:var(--acc)}
  .dr-head h2{margin:4px 0 0;font-size:16px;line-height:1.35;font-weight:600;max-width:430px}
  .dr-body{overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
  .meta-grid{display:grid;grid-template-columns:90px 1fr 90px 1fr;gap:7px 10px;font-size:11.5px;align-items:center}
  .meta-grid .k{color:var(--dim)}
  .meta-grid select,.meta-grid input{
    background:#141824;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11.5px;outline:none;width:100%;
  }
  .meta-grid select:focus{border-color:#3a4a72}
  .body-txt{white-space:pre-wrap;font-size:15.5px;color:#c9cfdd;background:#12151d;border:1px solid var(--line);border-radius:10px;padding:13px 15px;max-height:none;overflow:visible;line-height:1.62}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:#1b2130;border:1px solid #2a3246;border-radius:4px;padding:0 4px;color:#c7d4ff}
  .sec{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:2px 0 -6px}
  .sec .hint{text-transform:none;letter-spacing:0;color:#4d566b;font-size:10.5px}
  .term{margin:0;background:#0a0c11;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.6px;line-height:1.62;color:#c3ccdd;white-space:pre-wrap;word-break:break-word;max-height:min(46vh,460px);overflow:auto}
  .result{border-left:2px solid var(--acc);background:#131a2a;padding:11px 13px;border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap;color:#dbe3ff;max-height:none;overflow:visible}
  .kids{display:flex;flex-direction:column;gap:5px}
  .kid{display:flex;align-items:center;gap:8px;background:#12151d;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;cursor:pointer}
  .kid:hover{border-color:#31405f}
  .kid .kr{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim)}
  .kid .kt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .timeline{display:flex;flex-direction:column;gap:9px}
  .cm{background:#12151d;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .cm .h{display:flex;gap:7px;align-items:center;font-size:10.5px;color:var(--dim);margin-bottom:3px}
  .cm .who{font-family:ui-monospace,monospace;color:#9fb0d8;font-size:10px}
  .ref-link{color:var(--acc);text-decoration:none;border-bottom:1px dotted rgba(122,162,255,.6)}
  .ref-link:hover{background:rgba(122,162,255,.12)}
  .cm .b{font-size:13.5px;line-height:1.55;white-space:pre-wrap;color:#cdd4e4}
  .composer{display:flex;flex-direction:column;gap:7px}
  .composer textarea{
    background:#12151d;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:64px;
    resize:vertical;outline:none;font-size:12px;
  }
  .composer textarea:focus{border-color:#33405f}
  .dr-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:2px}

  /* ---------- agent skills & plugins drawer ---------- */
  .agent-dr{width:660px}
  .ad-mode{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#12151d;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px}
  .ad-mode select{background:#141824;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11.5px;outline:none}
  .ad-mode .ad-note{flex-basis:100%;color:var(--dim);font-size:10.5px;line-height:1.45}
  .ad-sec{display:flex;flex-direction:column;gap:7px}
  .tgl-list{display:flex;flex-direction:column;gap:4px}
  .tgl{display:flex;align-items:center;gap:8px;background:#12151d;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px}
  .tgl input{accent-color:var(--acc);flex:none}
  .tgl.ro{opacity:.62}
  .tgl.unavailable{border-color:#40232a}
  .tgl .nm{font-family:ui-monospace,monospace;color:#c3cce4;overflow-wrap:anywhere}
  .tgl .badge{margin-left:auto}
  .tgl .desc{margin-left:auto;color:var(--dim);font-size:10.5px;max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tgl .badge + .desc{margin-left:6px}
  .tgl .why{color:#d99a9a;font-size:10.5px;text-align:right}
  .tgl-grp{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#4d566b;margin:5px 0 -2px}
  .ad-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .badge{font-size:9.5px;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--mut);background:#151a26;white-space:nowrap}
  .b-inherited{color:#93a4c9;border-color:#2b3550;background:#161b2a}
  .b-explicit{color:#86efac;border-color:#234132;background:#101d16}
  .b-unavailable{color:#fca5a5;border-color:#40232a;background:#1d1417}
  .b-stale{color:#fcd34d;border-color:#453a1d;background:#1d1a10}
  .ad-disc{color:var(--dim);font-size:10.5px;line-height:1.55;overflow-wrap:anywhere}
  .ad-disc code{font-size:10px}
  .ad-status{font-size:11px;color:var(--mut);min-height:15px}
  .ad-status.ok{color:#86efac}
  .ad-status.bad{color:#ffb4b4}
  .ad-valid{font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
  .ad-valid code{font-size:10px}
  .ad-run{display:flex;flex-direction:column;gap:4px;background:#12151d;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px}
  .ad-run .dim{color:var(--dim)}
  .ad-honoured.yes{color:#86efac}
  .ad-honoured.no{color:#ffb4b4}
  .ad-honoured.unknown{color:var(--warn)}
  .ad-run details summary{cursor:pointer;color:var(--mut);font-size:10.5px}
  .ad-evidence{margin:6px 0 0;max-height:220px;overflow:auto;background:#0a0c11;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;line-height:1.55;color:#c3ccdd;white-space:pre-wrap;word-break:break-word}
  .ag-open{display:block;margin-top:2px;padding:0;font-size:9px;color:var(--acc);text-align:left;font-family:inherit}
  .ag-open:hover{text-decoration:underline}

  /* ---------- modal ---------- */
  .modal-wrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,5,8,.6);padding:20px}
  .modal-wrap.show{display:flex}
  .modal{width:560px;max-width:100%;max-height:86vh;overflow-y:auto;background:#0f1118;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 2px;font-size:15px}
  .modal p.sub{margin:0 0 14px;color:var(--mut);font-size:11.5px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .field input,.field select,.field textarea{
    background:#141824;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;outline:none;
  }
  .field textarea{min-height:90px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#3a4a72}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .agents-tbl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .ag{display:grid;grid-template-columns:64px 1fr 78px 78px 24px 22px;grid-template-areas:"slug name role div adapter del" "slug model model model enabled del" "slug profile profile profile profile del";gap:6px 7px;align-items:center;font-size:11px;background:#12151d;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .ag .s{grid-area:slug;font-family:ui-monospace,monospace;color:#c3cce4;overflow-wrap:anywhere}
  .ag .s .run{display:block;color:#d7b46a;font-size:9px;margin-top:2px}
  .ag .f-name{grid-area:name}
  .ag .f-role{grid-area:role}
  .ag .f-div{grid-area:div}
  .ag .f-adapter{grid-area:adapter}
  .ag .f-model{grid-area:model}
  .ag .f-profile{grid-area:profile}
  .ag .f-enabled{grid-area:enabled}
  .ag-del{grid-area:del;width:22px;height:22px;padding:0;line-height:1;border-radius:6px;font-size:14px;justify-self:end}
  .ag input,.ag select{background:#0f1219;border:1px solid #232838;border-radius:6px;padding:3px 5px;font-size:10.5px;width:100%;outline:none}
  .ag input[type=checkbox]{width:auto}
  .ag-confirm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;color:var(--mut);padding:5px 8px;border:1px dashed #40232a;border-radius:8px;background:#171218}
  .ag-confirm select{flex:1;min-width:110px;background:#0f1219;border:1px solid #232838;border-radius:6px;padding:3px 5px;font-size:10.5px}
  .evt{display:flex;gap:8px;font-size:11px;padding:5px 0;border-bottom:1px solid #1a1e2a;color:var(--mut)}
  .evt b{font-family:ui-monospace,monospace;font-weight:400;color:#93a4c9;min-width:52px}
  .evt .t{color:var(--dim);font-size:10px;margin-left:auto;white-space:nowrap}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;z-index:90;align-items:center}
  .toast{background:#161b26;border:1px solid #2c3550;color:#dfe6f7;font-size:12px;padding:8px 14px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s ease-out}
  .toast.err{border-color:#4a2730;background:#1e1215;color:#ffc9c9}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}

  @media (max-width:900px){
    .app{display:flex;flex-direction:column;height:100dvh}
    .rail{flex:none;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px;padding:8px 10px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
    .rail .brand{font-size:13px;flex:none}
    .rail .brand .ver{display:none}
    #btn-new{flex:none;white-space:nowrap;padding:6px 10px;font-size:12px}
    .rail-label{display:none}
    nav.divs{flex-direction:row;flex:none;gap:6px;overflow:visible}
    .divlink{width:auto;white-space:nowrap;padding:5px 9px;border-radius:20px;border:1px solid var(--line);background:#141926}
    .divlink .cnt{display:none}
    .divlink.active{box-shadow:none;border-color:var(--acc)}
    .agents-mini{flex-direction:row;flex:none;gap:6px}
    .agent-row{flex:none;background:#12151d;border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:11px}
    .agent-row .ad{display:none}
    .agent-row .sel{display:none}
    .agent-row span:nth-child(3){display:none}
    .rail-foot{display:none}
    main{min-height:0}
    .topbar{padding:10px 12px;gap:8px;flex-wrap:wrap;align-items:flex-start}
    .topbar h1{font-size:15px}
    .top-actions{margin-left:0;width:100%}
    .search{flex:1;width:auto}
    .livebar{padding:6px 12px;flex-wrap:nowrap;overflow-x:auto}
    .board{padding:10px 12px 16px;gap:10px;flex:1;min-height:0}
    .col{flex:0 0 86vw;min-width:86vw;max-width:none}
    .drawer{width:100%;max-width:100vw;border-left:none}
    .dr-head h2{max-width:none;font-size:15px}
    .dr-body{padding:12px 14px 20px}
    .meta-grid{grid-template-columns:72px 1fr}
    .modal{width:94vw;padding:16px;max-height:90vh}
    .term{max-height:38vh}
    .drawer{width:100%!important;max-width:100vw}
    .dr-body .term{flex:0 0 auto;height:auto;min-height:200px;max-height:46vh;margin:0 -14px;padding:10px 14px}
    .grip{display:none}
  }
  @media (max-width:560px){
    .ag{grid-template-columns:1fr 1fr;grid-template-areas:"slug del" "name name" "role div" "adapter enabled" "model model" "profile profile"}
  }

  /* ---------- readable + focus view ---------- */
  .sec-row{display:flex;align-items:center;gap:8px;margin:2px 0 -6px}
  .sec-row .sec{margin:0}
  .expand{margin-left:auto;background:#151a26;border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:1px 8px;font-size:12px;line-height:1.6;cursor:pointer;font-family:inherit}
  .expand:hover{color:var(--txt);border-color:#33405f}
  .focus-wrap{position:fixed;inset:0;z-index:80;display:none;background:rgba(5,6,10,.86);padding:clamp(8px,2.4vw,30px)}
  .focus-wrap.show{display:flex}
  .focus-card{display:flex;flex-direction:column;gap:10px;width:100%;max-width:1200px;height:100%;margin:auto;background:#0d1017;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
  .focus-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .focus-head .ft{font-size:13px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
  .focus-head .fr{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc)}
  .focus-body{flex:1;overflow:auto;background:#080a0f;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;line-height:1.66;color:#c7d2e6;white-space:pre-wrap;word-break:break-word}
  .focus-body.prose{font-family:inherit;font-size:17px;line-height:1.7;color:#d7dcea}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark">◈</span> Bureau <span class="ver" id="ver">v0</span></div>
    <button class="btn primary" id="btn-new">+ New ticket</button>

    <div class="rail-label"><span>Divisions</span><button id="btn-add-div" title="Add division">+</button></div>
    <nav class="divs" id="divs"></nav>

    <div class="rail-label"><span>Agents</span><button id="btn-agents" title="Manage agents">⋯</button></div>
    <div class="agents-mini" id="agents-mini"></div>

    <div class="rail-foot">
      <button class="btn" id="btn-tick">▶ Run dispatch tick</button>
      <button class="btn ghost small" id="btn-events">◷ Activity log</button>
      <div class="foot-note"><span id="foot-stats">–</span><span id="foot-dispatch"></span></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="ttl">All divisions</h1>
        <p id="sub">—</p>
      </div>
      <div class="top-actions">
        <div class="search"><span>⌕</span><input id="search" placeholder="Filter tickets…"><span class="kbd">/</span></div>
        <button class="btn ghost small" id="btn-pause-div" hidden>Pause</button>
        <button class="btn ghost small" id="btn-done" title="Show the Done column">Done</button>
        <button class="btn" id="btn-refresh" title="Refresh">↻</button>
      </div>
    </div>
    <div class="livebar" id="livebar"></div>
    <div class="board" id="board"></div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="grip" id="grip" title="Drag to resize · double-click for full width"></div>
  <div class="dr-head">
    <div style="flex:1">
      <div class="ref" id="dr-ref"></div>
      <h2 id="dr-title"></h2>
    </div>
    <button class="btn ghost small" id="dr-close">✕</button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<aside class="drawer agent-dr" id="agent-drawer" aria-label="Agent skills and plugins">
  <div class="dr-head">
    <div style="flex:1">
      <div class="ref" id="ad-ref"></div>
      <h2 id="ad-title">Skills &amp; plugins</h2>
    </div>
    <button class="btn ghost small" id="ad-close">✕</button>
  </div>
  <div class="dr-body" id="ad-body"></div>
</aside>

<div class="focus-wrap" id="focus-wrap"><div class="focus-card">
  <div class="focus-head"><span class="ft" id="focus-title">Agent output</span><span class="fr" id="focus-ref"></span>
    <span style="margin-left:auto;display:flex;gap:7px">
      <button class="btn small" id="focus-copy">copy</button>
      <button class="btn small" id="focus-close">close</button>
    </span>
  </div>
  <div class="focus-body" id="focus-body"></div>
</div></div>
<div class="modal-wrap" id="modal-wrap"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// escaped text + inline `code` spans, for bodies/agent output
const rich = (s) => esc(s)
  .replace(/`([^`\n]+)`/g, "<code>$1</code>")
  .replace(/\b(BUR-\d+)\b/g, '<a href="#" class="ref-link" data-ref="$1">$1</a>');
const ago = (iso) => {
  if (!iso) return "";
  const t = Date.parse(iso); if (isNaN(t)) return iso;
  const d = Math.max(0, (Date.now() - t) / 1000);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d/60) + "m ago";
  if (d < 86400) return Math.floor(d/3600) + "h ago";
  return Math.floor(d/86400) + "d ago";
};
const COLS = [
  {id:"new", label:"New", st:["new"]},
  {id:"queued", label:"Queued", st:["triaged","queued"]},
  {id:"working", label:"In progress", st:["in_progress"]},
  {id:"review", label:"Review", st:["review"]},
  {id:"done", label:"Done", st:["done"]},
  {id:"attention", label:"Blocked", st:["blocked","failed"]},
];

const S = { snap:null, snapJson:null, division:"all", q:"", openRef:null, openData:null, openJson:null, drRef:null, logPin:null, busy:false, timer:null, showDone:false };

// view state survives a reload: ticket in the hash, filters in localStorage
const VIEW_KEY = "bureau_view", BOARD_KEY = "bureau_board";
const view = (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY) || "{}"); } catch { return {}; } })();
if (typeof view.division === "string") S.division = view.division;
if (typeof view.q === "string") S.q = view.q;
if (S.q) $("#search").value = S.q;
S.showDone = !!view.showDone;
const saveView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify({division:S.division, q:S.q, showDone:S.showDone})); } catch {} };

const boardScroll = (() => { try { const v = JSON.parse(localStorage.getItem(BOARD_KEY) || "{}"); return { left: +v.left || 0, cols: v.cols || {} }; } catch { return { left: 0, cols: {} }; } })();
let boardSave = null;
const persistBoard = () => { try { localStorage.setItem(BOARD_KEY, JSON.stringify(boardScroll)); } catch {} };
$("#board").addEventListener("scroll", () => {
  const board = $("#board");
  boardScroll.left = board.scrollLeft;
  board.querySelectorAll(".col").forEach(c => { const cs = c.querySelector(".cards"); if (cs) boardScroll.cols[c.dataset.col] = cs.scrollTop; });
  clearTimeout(boardSave); boardSave = setTimeout(persistBoard, 250);
}, true);
addEventListener("beforeunload", persistBoard);

// drawer read position, per ticket ref, so F5 in the middle of a description resumes there
const DR_SCROLL_KEY = "bureau_dr_scroll";
const drScroll = (() => { try { return JSON.parse(localStorage.getItem(DR_SCROLL_KEY) || "{}"); } catch { return {}; } })();
let drScrollSave = null;
const persistDrScroll = () => { try { localStorage.setItem(DR_SCROLL_KEY, JSON.stringify(drScroll)); } catch {} };
$("#dr-body").addEventListener("scroll", () => {
  if (!S.openRef || !S.openData) return;
  drScroll[S.openRef] = $("#dr-body").scrollTop;
  clearTimeout(drScrollSave); drScrollSave = setTimeout(persistDrScroll, 250);
}, true);
addEventListener("beforeunload", persistDrScroll);

const tok = () => localStorage.getItem("bureau_token") || "";
async function api(path, opts={}, retried=false) {
  const headers = { "content-type": "application/json", ...(opts.headers || {}) };
  if (tok()) headers["x-bureau-token"] = tok();
  const res = await fetch(path, {
    ...opts,
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    if (!retried) {
      const entered = window.prompt("Bureau is protected by a token.\nPaste BUREAU_TOKEN (see /etc/bureau/bureau.env):");
      if (entered && entered.trim()) {
        localStorage.setItem("bureau_token", entered.trim());
        return api(path, opts, true);
      }
    }
    throw new Error("access token required");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || (res.status + " " + res.statusText));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
// ?token=… in the URL bootstraps localStorage, then disappears from the address bar.
(function bootstrapToken() {
  const u = new URL(location.href);
  const t = u.searchParams.get("token");
  if (!t) return;
  localStorage.setItem("bureau_token", t);
  u.searchParams.delete("token");
  history.replaceState({}, "", u.pathname + (u.search || "") + (u.hash || ""));
})();
function toast(msg, err=false) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

/* ---------------- per-agent enablement summary ---------------- */
// One small badge per rail agent: enabled skills + plugins out of the catalog.
// Loaded once per slug until a save updates it, so the 4 s poll stays cheap.
const SUMMARY = new Map(), SUMMARY_PENDING = new Set();
function summarize(data) {
  const count = (list) => {
    const items = Array.isArray(list) ? list : [];
    return { on: items.filter(i => i.enabled && i.origin !== "unavailable").length, total: items.length };
  };
  return { skills: count(data.skills), plugins: count(data.plugins) };
}
function updateSummary(slug, data) {
  SUMMARY.set(slug, summarize(data || {}));
}
async function refreshSummaries(agents) {
  for (const agent of agents) {
    const slug = agent.slug;
    if (!slug || SUMMARY.has(slug) || SUMMARY_PENDING.has(slug)) continue;
    SUMMARY_PENDING.add(slug);
    api("/api/agents/" + encodeURIComponent(slug) + "/skills").then(d => {
      updateSummary(slug, d);
      renderRail();
    }).catch(() => {}).finally(() => SUMMARY_PENDING.delete(slug));
  }
}

async function load() {
  try {
    const snap = await api("/api/state");
    // `live` carries process elapsed seconds and the event feed grows constantly;
    // keying the board off them would repaint every 4s and lose scroll. Sign only
    // what the rail/board actually draw.
    // divisions carry `paused`, so a pause/resume repaints the rail without a reload.
    const key = JSON.stringify([snap.version, snap.divisions, snap.agents, snap.tickets, snap.stats, snap.dispatching]);
    const changed = key !== S.snapJson;
    S.snap = snap; S.snapJson = key;
    refreshSummaries(snap.agents || []);
    if (changed) {
      const sx = scrollX, sy = scrollY;
      renderRail(); renderBoard(); renderFoot();
      scrollTo(sx, sy);
    } else {
      renderLive(snap.live || []);   // chips and timers stay live without a full repaint
    }
    if (S.openRef) refreshDrawer(true);
  } catch (e) {
    $("#foot-stats").textContent = "offline";
  }
}

function divColor(i){ return "c" + ((i % 6) + 1); }

function renderRail() {
  const s = S.snap; if (!s) return;
  $("#ver").textContent = "v" + s.version;
  const all = s.tickets.length;
  const open = s.tickets.filter(t => !["done","failed"].includes(t.status)).length;
  let html = `<button class="divlink ${S.division==="all"?"active":""}" data-div="all">
      <span class="dot" style="background:#7c9cff"></span>
      <span class="nm">All divisions</span><span class="cnt ${open?"hot":""}">${open}</span></button>`;
  s.divisions.forEach((d,i) => {
    const n = d.counts.new + d.counts.triaged + d.counts.queued + d.counts.in_progress + d.counts.blocked + d.counts.failed;
    const paused = !!d.paused;
    html += `<button class="divlink ${S.division===d.slug?"active":""}${paused?" paused":""}" data-div="${esc(d.slug)}" title="${esc(d.project_path)}${paused?" — paused: new work will not start":""}">
      <span class="dot ${divColor(i)}"></span>
      <span class="nm">${esc(d.name)}${paused?' <span class="pause-tag">paused</span>':""}</span>
      <span class="cnt ${n?"hot":""}">${n}</span></button>`;
  });
  $("#divs").innerHTML = html;
  $("#divs").querySelectorAll("[data-div]").forEach(b => b.onclick = () => { S.division = b.dataset.div; renderRail(); renderBoard(); writeStateToUrl(false); });

  const cur = s.divisions.find(d => d.slug === S.division);
  $("#ttl").textContent = cur ? cur.name : "All divisions";
  const pauseBtn = $("#btn-pause-div");
  if (pauseBtn) {
    pauseBtn.hidden = !cur;
    if (cur) {
      pauseBtn.textContent = cur.paused ? "Resume" : "Pause";
      pauseBtn.title = cur.paused
        ? "Allow this division to start new work again"
        : "Stop starting new work; tickets already in progress finish";
      pauseBtn.onclick = () => toggleDivisionPause(cur);
    }
  }
  $("#sub").textContent = cur
    ? `${cur.manager ? "manager " + cur.manager.slug : "no manager"} · ${cur.project_path || "no path"}`
    : `${s.divisions.length} divisions · ${s.agents.length} agents · ${s.tickets.length} tickets`;

  const agents = cur ? s.agents.filter(a => a.division_id === cur.id) : s.agents;
  const shown = agents.slice(0, 8);
  $("#agents-mini").innerHTML = shown.map(a => {
    const sum = SUMMARY.get(a.slug);
    const sel = sum ? `<span class="sel" title="${sum.skills.on + sum.plugins.on} of ${sum.skills.total + sum.plugins.total} skills and plugins enabled">⚙ ${sum.skills.on + sum.plugins.on}/${sum.skills.total + sum.plugins.total}</span>` : "";
    return `<div class="agent-row" data-agent="${esc(a.slug)}" title="${esc(a.role)} · ${esc(a.adapter)} · click for skills and plugins">
      <span class="st ${esc(a.status)}"></span>
      <span class="slug">${esc(a.slug)}</span>
      <span>${esc(a.role === "manager" ? "manager" : "")}</span>
      <span class="ad">${esc(a.adapter)}${a.model ? " · " + esc(a.model.split(":")[0]) : ""}${a.enabled ? "" : " · off"}</span>
      ${a.plugin_profile ? `<span class="prof" title="opencode plugin profile">${esc(a.plugin_profile)}</span>` : ""}
      ${sel}
    </div>`;
  }).join("") + (agents.length > shown.length
      ? `<div class="agent-row" style="color:#5d6579">+${agents.length - shown.length} more · <button class="btn ghost small" id="btn-more-agents" style="padding:0 4px">manage</button></div>`
      : "") || `<div class="empty">no agents</div>`;
  $("#agents-mini").querySelectorAll(".agent-row[data-agent]").forEach(row => {
    row.onclick = () => openAgent(row.dataset.agent);
  });
  const more = $("#btn-more-agents"); if (more) more.onclick = (e) => { e.stopPropagation(); agentsModal(); };
  renderLive(s.live || []);
}

function visibleTickets() {
  const s = S.snap; if (!s) return [];
  let ts = s.tickets;
  if (S.division !== "all") ts = ts.filter(t => t.division_slug === S.division);
  if (S.q) ts = ts.filter(t => (t.ref + " " + t.title + " " + t.body).toLowerCase().includes(S.q));
  return ts;
}

function card(t) {
  const p = t.priority;
  const subs = t.children.length
    ? `<div class="subs">${t.children.slice(0,3).map(c =>
        `<div><b>${esc(c.ref)}</b> ${esc(c.title)}</div>`).join("")}
        ${t.children.length > 3 ? `<div>+${t.children.length-3} more</div>` : ""}</div>` : "";
  return `<div class="card ${t.status==="done"?"done":""} ${["blocked","failed"].includes(t.status)?"blocked":""}" data-ref="${esc(t.ref)}">
    <div class="ref">${esc(t.ref)} · ${esc(t.division_slug)}</div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="meta">
      <span class="pill p${p}">P${p}</span>
      ${t.assignee_slug ? `<span class="pill who">${esc(t.assignee_slug)}</span>` : `<span class="pill">unassigned</span>`}
      ${t.children.length ? `<span class="pill sub">${t.children.length} sub</span>` : ""}
      ${t.comment_count ? `<span class="pill">${t.comment_count} 💬</span>` : ""}
      ${t.attempts ? `<span class="pill">try ${t.attempts}</span>` : ""}
    </div>
    ${subs}
  </div>`;
}

function renderBoard() {
  const s = S.snap; if (!s) return;
  const ts = visibleTickets();
  const done = ts.filter(t => t.status === "done").length;
  $("#btn-done").classList.toggle("primary", S.showDone);
  $("#btn-done").textContent = `Done · ${done}`;
  const cols = COLS.filter(c => S.showDone || c.id !== "done");
  const board = $("#board");
  // capture before the rewrite, so a refresh never loses the reader's place
  if (board.querySelector(".col")) {
    boardScroll.left = board.scrollLeft;
    board.querySelectorAll(".col").forEach(c => {
      const cs = c.querySelector(".cards");
      if (cs) boardScroll.cols[c.dataset.col] = cs.scrollTop;
    });
  }
  // A sub-ticket whose parent is itself waiting for review is not a separate
  // decision: the parent is. Hide it there so one feature reads as one card.
  const byRef = new Map(ts.map(t => [t.ref, t]));
  const absorbedByParent = t => {
    const p = t.parent_ref ? byRef.get(t.parent_ref) : null;
    return !!p && (p.status === "review" || p.status === "done");
  };
  board.innerHTML = cols.map(col => {
    const all = ts.filter(t => col.st.includes(t.status));
    const hidden = col.id === "review" ? all.filter(absorbedByParent).length : 0;
    const items = (col.id === "review" ? all.filter(t => !absorbedByParent(t)) : all)
      .sort((a,b) => a.priority - b.priority || a.id - b.id);
    const sub = hidden ? ` <span class="n sub" title="sub-tickets of a parent that is already in review">+${hidden} sub</span>` : "";
    return `<section class="col ${col.id}" data-col="${col.id}">
      <div class="col-head"><span class="t">${col.label}</span><span class="n">${items.length}</span>${sub}</div>
      <div class="cards">${items.length ? items.map(card).join("") : `<div class="empty">nothing here</div>`}</div>
    </section>`;
  }).join("");
  // keyed by column id, so adding or removing Done never shifts another column's offset
  board.querySelectorAll(".col").forEach(c => {
    const cards = c.querySelector(".cards");
    if (cards) cards.scrollTop = boardScroll.cols[c.dataset.col] || 0;
  });
  board.scrollLeft = boardScroll.left;
}

function renderFoot() {

/* ---------------- url state ---------------- */
// #/t/<REF>?div=<slug>&done=1 — the whole view, so a reload or a shared link lands in place.
const hashState = () => {
  const raw = location.hash.replace(/^#/, "");
  const qi = raw.indexOf("?");
  const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : "");
  const m = raw.match(/^\/?t\/([^/?#]+)/);
  return { ref: m ? decodeURIComponent(m[1]) : null, div: params.get("div"), done: params.get("done") };
};
// Boot only: a hash wins over the localStorage copy, but a missing param keeps the saved filter.
function readStateFromUrl() {
  const st = hashState();
  if (st.div) S.division = st.div;
  if (st.done !== null) S.showDone = st.done === "1";
  if (st.ref) S.openRef = st.ref;
}
let applyingUrl = false;   // true while reacting to back/forward, so we never push a nested entry
function writeStateToUrl(push = false, force = false) {
  if (applyingUrl && !force) return;
  const params = new URLSearchParams();
  if (S.division && S.division !== "all") params.set("div", S.division);
  if (S.showDone) params.set("done", "1");
  const qs = params.toString();
  const hash = (S.openRef ? "#/t/" + encodeURIComponent(S.openRef) : "") + (qs ? (S.openRef ? "?" : "#/?") + qs : "");
  // built from pathname + search only: bootstrapToken() already stripped ?token, so it never leaks
  const url = location.pathname + location.search + hash;
  if (url === location.pathname + location.search + location.hash) { saveView(); return; }
  // call on history itself: a detached pushState reference throws "Illegal invocation"
  (push ? history.pushState : history.replaceState).call(history, { bureau: 1 }, "", url);
  saveView();
}
async function openTicket(ref, opts = {}) {
  // A ref absent from the last snapshot is stale: drop it instead of firing a 404.
  if (!opts.fresh && S.snap && !S.snap.tickets.some(t => t.ref === ref)) {
    toast(ref + " is no longer on the board", true);
    closeDrawer({ silent: true });
    writeStateToUrl(false, true);
    return;
  }
  S.openRef = ref;
  S.openData = null; S.openJson = null; S.logPin = null;
  $("#backdrop").classList.add("show");
  $("#drawer").classList.add("show");
  $("#dr-body").innerHTML = `<div class="empty">loading…</div>`;
  if (!opts.silent) writeStateToUrl(true);
  const ok = await refreshDrawer(!!opts.restore);
  if (S.openRef !== ref) return;
  if (ok) return;
  // a ref that no longer exists must not leave a dead drawer or a stale hash behind
  closeDrawer({ silent: true });
  writeStateToUrl(false, true);
}
function closeDrawer(opts = {}) {
  S.openRef = null; S.openData = null; S.openJson = null; S.logPin = null;
  clearInterval(S.logTimer); S.logTimer = null;
  $("#backdrop").classList.remove("show");
  $("#drawer").classList.remove("show");
  if ($("#agent-drawer").classList.contains("show")) $("#backdrop").classList.add("show");
  if (!opts.silent) writeStateToUrl(false);
}

/* ---------------- drawer ---------------- */
async function refreshDrawer(soft) {
  if (!S.openRef) return false;
  const ref = S.openRef;
  const prev = S.openData && S.openData.ticket.ref;
  try {
    const d = await api("/api/tickets/" + encodeURIComponent(ref));
    if (S.openRef !== ref) return false;
    const json = JSON.stringify(d);
    if (S.openData && S.openJson === json) return true;   // unchanged: touch nothing (keeps scroll, selection, draft)
    S.openJson = json; S.openData = d;
    renderDrawer(prev === d.ticket.ref);
    return true;
  } catch (e) { if (!soft) toast(e.message, true); return false; }
}
function renderDrawer(keep) {
  const d = S.openData; if (!d) return;
  const t = d.ticket;
  // capture live UI state so a re-render never yanks the reader or clobbers a draft
  const active = document.activeElement;
  const actId = active && keep && $("#dr-body").contains(active) ? active.id : "";
  const caret = actId === "dr-comment" ? [active.selectionStart, active.selectionEnd] : null;
  const draft = $("#dr-comment");
  const draftVal = draft ? draft.value : "";
  const draftTop = draft ? draft.scrollTop : 0;
  const bodyEl = $("#dr-body");
  const bodyTop = keep ? bodyEl.scrollTop : Math.max(0, +drScroll[t.ref] || 0);
  const bodyHeight = keep ? bodyEl.scrollHeight : 0;
  const log = $("#dr-log");
  const logTop = keep && log ? log.scrollTop : 0;
  const logText = log ? log.textContent : "";
  const logAtBottom = !log || log.scrollHeight - log.scrollTop - log.clientHeight < 48;
  S.logPin = keep && !logAtBottom ? { ref: t.ref, top: logTop } : null;
  $("#dr-ref").textContent = `${t.ref} · ${t.division_slug} · opened by ${t.created_by} · ${ago(t.created_at)}`;
  $("#dr-title").textContent = t.title;

  const div = S.snap.divisions.find(x => x.id === t.division_id);
  const agents = S.snap.agents.filter(a => a.division_id === t.division_id);
  const kids = t.children.map(c => `
    <div class="kid" data-ref="${esc(c.ref)}">
      <span class="kr">${esc(c.ref)}</span>
      <span class="pill">${esc(c.status)}</span>
      <span class="kt">${esc(c.title)}</span>
      <span class="pill who">${esc(c.assignee || "-")}</span>
    </div>`).join("");
  const comments = d.comments.map(c => `
    <div class="cm"><div class="h"><span class="who">${esc(c.author)}</span><span>${ago(c.created_at)}</span></div>
    <div class="b">${rich(c.body)}</div></div>`).join("");

  const actions = [
    t.status !== "done" ? `<button class="btn small" data-act="done">✓ Approve / done</button>` : `<button class="btn small" data-act="review">↺ Reopen</button>`,
    t.status !== "blocked" ? `<button class="btn small danger" data-act="blocked">⊘ Block</button>` : "",
    t.status !== "queued" ? `<button class="btn small" data-act="queued">→ Queue</button>` : "",
  ].join("");

  $("#dr-body").innerHTML = `
    <div class="meta-grid">
      <span class="k">Status</span>
      <span><span class="pill ${t.status==="done"?"ok":""}">${esc(t.status)}</span></span>
      <span class="k">Priority</span>
      <select id="dr-prio">${[0,1,2,3,4].map(p => `<option value="${p}" ${p===t.priority?"selected":""}>P${p}</option>`).join("")}</select>
      <span class="k">Division</span>
      <span>${esc(div ? div.name : t.division_slug)}</span>
      <span class="k">Assignee</span>
      <select id="dr-assignee"><option value="">— unassigned —</option>
        ${agents.map(a => `<option value="${esc(a.slug)}" ${a.slug===t.assignee_slug?"selected":""}>${esc(a.slug)} (${esc(a.role)})</option>`).join("")}
      </select>
    </div>
    ${t.body ? `<div class="sec-row"><div class="sec">Description</div><button class="expand" data-focus="desc" title="Open full size">⤢</button></div><div class="body-txt" id="dr-desc">${rich(t.body)}</div>` : ""}
    ${t.result ? `<div class="sec-row"><div class="sec">Result</div><button class="expand" data-focus="result" title="Open full size">⤢</button></div><div class="result" id="dr-result">${rich(t.result)}</div>` : ""}
    <div class="sec-row"><div class="sec">Agent output <span class="hint">· live terminal</span></div><button class="expand" data-focus="log" title="Open full size">⤢</button></div>
    <pre class="term" id="dr-log">${logText ? esc(logText) : "loading…"}</pre>
    ${kids ? `<div class="sec">Sub-tickets (${t.children.length})</div><div class="kids">${kids}</div>` : ""}
    <div class="sec">Timeline</div>
    <div class="timeline">${comments || `<div class="empty">no comments yet</div>`}</div>
    <div class="composer">
      <textarea id="dr-comment" placeholder="Add a comment for the agents or yourself…"></textarea>
      <div style="display:flex;gap:7px">
        <button class="btn small" id="dr-send">Comment</button>
        <span style="margin-left:auto"></span>
        ${actions}
      </div>
    </div>`;

  const body = $("#dr-body");
  // A ticket that just lost most of its content (body cleared, comments pruned)
  // must not be forced to an offset past the new end.
  if (!bodyHeight || body.scrollHeight >= bodyHeight * 0.5) body.scrollTop = bodyTop;
  const newLog = $("#dr-log");
  if (newLog) {
    if (S.logPin) newLog.scrollTop = S.logPin.top;                       // hold the reader's place
    else if (keep && logAtBottom) newLog.scrollTop = newLog.scrollHeight; // still follow the tail
  }
  const cm = $("#dr-comment");
  if (cm && keep) { cm.value = draftVal; cm.scrollTop = draftTop; }
  // preventScroll: focusing the composer must not scroll #dr-body away from the restored position
  if (caret && cm) { cm.focus({ preventScroll: true }); cm.setSelectionRange(caret[0], caret[1]); }
  else if (actId) { const el = document.getElementById(actId); if (el) el.focus({ preventScroll: true }); }

  $("#dr-close").onclick = closeDrawer;
  // The agent drawer can sit on top of an open ticket drawer; the shared
  // backdrop must still close the topmost one.
  $("#backdrop").onclick = () => {
    if ($("#agent-drawer").classList.contains("show")) closeAgentDrawer();
    else closeDrawer();
  };
  $("#dr-prio").onchange = async (e) => {
    await api("/api/tickets/" + t.ref, {method:"PATCH", body:{priority:+e.target.value}});
    toast(`priority → P${e.target.value}`); load(); refreshDrawer(true);
  };
  $("#dr-assignee").onchange = async (e) => {
    await api("/api/tickets/" + t.ref, {method:"PATCH", body:{assignee:e.target.value}});
    toast(e.target.value ? `assigned to ${e.target.value}` : "unassigned"); load(); refreshDrawer(true);
  };
  $("#dr-send").onclick = async () => {
    const box = $("#dr-comment");
    if (!box.value.trim()) return;
    await api("/api/tickets/" + t.ref + "/comment", {method:"POST", body:{body:box.value.trim()}});
    box.value = ""; toast("comment added"); refreshDrawer(true); load();
  };
  $("#dr-body").querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    await api("/api/tickets/" + t.ref, {method:"PATCH", body:{status:b.dataset.act}});
    toast(`${t.ref} → ${b.dataset.act}`); load(); refreshDrawer(true);
  });
  watchLog(t.ref);
}

/* ---------------- modals ---------------- */
function watchLog(ref) {
  clearInterval(S.logTimer); S.logTimer = null;
  const paint = async () => {
    if (S.openRef !== ref) return;
    try {
      const d = await api(`/api/tickets/${encodeURIComponent(ref)}/log?lines=400`);
      const el = $("#dr-log"); if (!el) return;
      const pin = S.logPin && S.logPin.ref === ref ? S.logPin.top : null;
      const atBottom = pin === null && el.scrollHeight - el.scrollTop - el.clientHeight < 48;
      el.textContent = d.lines.length
        ? d.lines.join("\n")
        : (d.exists ? "(waiting for output…)" : "no output yet — this agent has not run");
      if (pin !== null) { el.scrollTop = pin; S.logPin = null; }
      else if (atBottom) el.scrollTop = el.scrollHeight;
    } catch (e) { /* drawer may have closed */ }
  };
  paint();
  S.logTimer = setInterval(() => {
    if (S.openRef !== ref) { clearInterval(S.logTimer); return; }
    const st = (S.openData && S.openData.ticket && S.openData.ticket.status) || "";
    if (st === "in_progress" || st === "new" || st === "queued") paint();
  }, 2500);
}

function fmtDur(secs) {
  if (!isFinite(secs) || secs < 0) secs = 0;
  const h = Math.floor(secs / 3600), m = Math.floor(secs / 60) % 60, s = Math.floor(secs % 60);
  if (h) return `${h}h${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}

function renderLive(live) {
  const el = $("#livebar"); if (!el) return;
  if (!live.length) {
    el.innerHTML = `<span class="lab">Live</span><span class="live-idle">no agent running — waiting for work</span>`;
    return;
  }
  el.innerHTML = `<span class="lab">Live</span>` + live.map((l, i) => {
    const secs = (Date.now() - new Date(l.started_at)) / 1000;
    const n = (l.procs || []).length;
    return `<button class="live-chip" data-i="${i}" title="${esc(l.title || "")}">
      <span class="dot"></span><span class="who">${esc(l.agent || "?")}</span>
      <span class="ref">${esc(l.ref)}</span><span class="t">${fmtDur(secs)}</span>
      ${n ? `<span class="n">${n} proc${n > 1 ? "s" : ""}</span>` : ""}
    </button>`;
  }).join("");
  el.querySelectorAll(".live-chip").forEach(b => {
    b.onclick = () => liveModal(live[+b.dataset.i]);
  });
}

function liveModal(l) {
  const secs = (Date.now() - new Date(l.started_at)) / 1000;
  const rows = (l.procs || []).map(p => `<div class="live-proc">
      <span class="pid">${p.pid}</span><span class="secs">${fmtDur(p.secs)}</span>
      <code>${esc(p.cmd)}</code></div>`).join("")
    || `<div class="empty">no matching processes right now</div>`;
  openModal(`<h3>${esc(l.agent || "?")} → ${esc(l.ref)}</h3>
    <p class="sub">${esc(l.title || "")} · running ${fmtDur(secs)} · ${esc(l.role || "worker")}</p>
    <div class="live-procs">${rows}</div>
    <div class="sec">Agent output <span class="hint">· live terminal</span></div>
    <pre class="term" id="lm-log">loading…</pre>
    <p class="sub">Live process tree under the Bureau server — subagents show up as children of the agent CLI.</p>
    <div class="modal-actions"><button class="btn" id="lm-open">Open ${esc(l.ref)}</button><button class="btn ghost" id="lm-close">Close</button></div>`);
  $("#lm-open").onclick = () => { closeModal(); openTicket(l.ref); };
  $("#lm-close").onclick = closeModal;
  paintLog(l.ref, "lm-log", 120);
}

async function paintLog(ref, elId, lines) {
  try {
    const d = await api(`/api/tickets/${encodeURIComponent(ref)}/log?lines=${lines || 200}`);
    const el = $("#" + elId); if (!el) return;
    el.textContent = d.lines.length
      ? d.lines.join("\n")
      : (d.exists ? "(waiting for output…)" : "no output yet — this agent has not run");
    el.scrollTop = el.scrollHeight;
  } catch (e) { /* drawer/modal gone */ }
}

    <div class="modal-actions"><button class="btn ghost" id="m-cancel">Close</button><button class="btn" id="na-create">Add agent</button></div>`);

  $("#m-cancel").onclick = closeModal;

  // Deletes run immediately: the server moves the agent's open tickets to
  // ?reassign=<slug> or back to triage, and the row leaves the DOM so Save
  // never PATCHes it.
  const deleteRow = async (row) => {
    const slug = row.dataset.slug;
    if (!window.confirm(`Delete agent ${slug}?`)) return;
    const snap = S.snap;
    const agent = snap.agents.find(a => a.slug === slug) || { id: -1, division_id: null };
    const movable = ["triaged", "queued", "in_progress", "review"];
    const open = snap.tickets.filter(t => t.assignee_slug === slug && movable.includes(t.status));

    };
    if (!open.length) return run("");

    const mates = snap.agents.filter(a => a.id !== agent.id && a.division_id === agent.division_id && a.role === "worker");
    const strip = document.createElement("div");
    strip.className = "ag-confirm";
    strip.innerHTML = `<span>${open.length} open ticket${open.length===1?"":"s"}:</span>
      <select><option value="">— send back to triage —</option>${mates.map(m => `<option value="${esc(m.slug)}">${esc(m.slug)}</option>`).join("")}</select>
      <button class="btn small ghost" data-x="cancel">Cancel</button>
      <button class="btn small danger" data-x="ok">Delete</button>`;
    row.after(strip);
    strip.querySelector('[data-x="cancel"]').onclick = () => strip.remove();
    strip.querySelector('[data-x="ok"]').onclick = () => {
      const reassign = strip.querySelector("select").value;
      strip.remove(); run(reassign);
    };
  };
  $("#modal").querySelectorAll(".ag-del").forEach(b => { b.onclick = () => deleteRow(b.closest(".ag")); });
  $("#modal").querySelectorAll(".ag-open").forEach(b => { b.onclick = () => { closeModal(); openAgent(b.dataset.slug); }; });

  $("#save-agents").onclick = async () => {
    const rows = [...$("#modal").querySelectorAll(".ag")];
    for (const r of rows) {
      if (!r.querySelector(".f-name").value.trim()) return toast("name is required for " + r.dataset.slug, true);
    }
    try {
      for (const r of rows) {
        const body = {
          name: r.querySelector(".f-name").value.trim(),
          role: r.querySelector(".f-role").value,
          division: r.querySelector(".f-div").value,
          adapter: r.querySelector(".f-adapter").value,
          model: r.querySelector(".f-model").value,
          enabled: r.querySelector(".f-enabled").checked,
        };
        // null clears the profile; "" would be rejected by the API.
        if (hasProfiles) body.plugin_profile = r.querySelector(".f-profile").value.trim() || null;
        await api("/api/agents/" + encodeURIComponent(r.dataset.slug), {method:"PATCH", body});
      }
      toast("agents saved"); closeModal(); load();
    } catch (e) { toast(e.message, true); }
  };
  $("#na-create").onclick = async () => {
    try {
      await api("/api/agents", {method:"POST", body:{
        slug:$("#na-slug").value.trim(), name:$("#na-name").value.trim() || $("#na-slug").value.trim(),
        role:$("#na-role").value, division:$("#na-div").value, adapter:"demo"
      }});
      toast("agent added"); closeModal(); load();
    } catch (e) { toast(e.message, true); }
  };
}

/* ---------------- agent skills & plugins drawer ---------------- */
const AG = { slug:null, data:null, detail:null, busy:false };

function closeAgentDrawer() {
  AG.slug = null; AG.data = null; AG.detail = null; AG.busy = false;
  $("#agent-drawer").classList.remove("show");
  if ($("#drawer").classList.contains("show")) {
    $("#backdrop").classList.add("show");
    $("#backdrop").onclick = closeDrawer;
  } else {
    $("#backdrop").classList.remove("show");
  }
}

async function openAgent(slug) {
  AG.slug = slug; AG.data = null; AG.detail = null; AG.busy = false;
  $("#agent-drawer").classList.add("show");
  $("#backdrop").classList.add("show");
  $("#backdrop").onclick = closeAgentDrawer;
  $("#ad-ref").textContent = slug;
  $("#ad-title").textContent = "Skills & plugins";
  $("#ad-body").innerHTML = `<div class="empty">loading skills and plugins…</div>`;
  await loadAgentDetail();
}

async function loadAgentDetail() {
  const slug = AG.slug;
  if (!slug) return;
  // The detail read carries last_run evidence; the skills read is the catalog.
  // They are independent, so a missing detail endpoint never hides the toggles.
  const [skills, detail] = await Promise.allSettled([
    api("/api/agents/" + encodeURIComponent(slug) + "/skills"),
    api("/api/agents/" + encodeURIComponent(slug)),
  ]);
  if (AG.slug !== slug) return;
  if (skills.status === "rejected") {
    const e = skills.reason || {};
    $("#ad-body").innerHTML = `<div class="empty">skills and plugins are not available for <code>${esc(slug)}</code>.</div>
      <div class="ad-disc">The board needs <code>GET /api/agents/&lt;slug&gt;/skills</code>. The server answered: ${esc(e.message || e)}.</div>`;
    return;
  }
  AG.data = skills.value || {};
  AG.detail = detail.status === "fulfilled" ? detail.value : null;
  updateSummary(slug, AG.data);
  renderAgentDrawer();
}

const SOURCE_GROUPS = [
  ["global", "Global defaults"],
  ["generated", "Generated profile"],
  ["profile", "Profile"],
  ["project", "Project"],
  ["installed", "Installed plugins"],
  ["other", "Other"],
];
function sourceGroup(source) {
  const s = String(source || "");
  if (s.startsWith("generated:")) return "generated";
  if (s.startsWith("profile:")) return "profile";
  if (s.startsWith(".opencode")) return "project";
  if (s === "installed") return "installed";
  if (s.startsWith("~/")) return "global";
  return "other";
}
function groupLabel(key, items) {
  const label = (SOURCE_GROUPS.find(g => g[0] === key) || ["", "Other"])[1];
  if (key === "generated" || key === "profile") {
    const suffix = String((items[0] && items[0].source) || "").split(":")[1];
    return label + (suffix ? " · " + suffix : "");
  }
  return label;
}
function groupItems(items) {
  const groups = new Map();
  for (const item of items) {
    const key = sourceGroup(item.source);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  return SOURCE_GROUPS.filter(([key]) => groups.has(key)).map(([key]) => [key, groups.get(key)]);
}
function toggleRow(kind, item) {
  const unavailable = item.origin === "unavailable";
  const checked = !unavailable && item.enabled !== false;
  const desc = item.description
    ? `<span class="desc" title="${esc(item.description)}">${esc(item.description)}</span>`
    : "";
  return `<label class="tgl${unavailable ? " unavailable" : ""}" title="${esc(item.description || item.name)}">
    <input type="checkbox" data-kind="${kind}" data-name="${esc(item.name)}" ${checked ? "checked" : ""} ${unavailable ? "disabled" : ""}>
    <span class="nm">${esc(item.name)}</span>
    ${item.origin === "override" ? `<span class="badge">changed</span>` : ""}
    ${unavailable ? `<span class="why">${esc(item.reason || "declared but not installed")}</span>` : desc}
  </label>`;
}
function renderToggleSection(title, kind, items) {
  const list = Array.isArray(items) ? items : [];
  const on = list.filter(i => i.enabled && i.origin !== "unavailable").length;
  const groups = groupItems(list).map(([key, group]) =>
    `<div class="tgl-grp">${esc(groupLabel(key, group))}</div>
     <div class="tgl-list">${group.map(i => toggleRow(kind, i)).join("")}</div>`
  ).join("");
  return `<div class="ad-sec" data-section="${kind}">
    <div class="sec">${title} <span class="hint">· ${on} of ${list.length} ${kind} enabled</span></div>
    ${list.length ? groups : `<div class="empty">none discovered</div>`}
    <div class="ad-row">
      <button class="btn small" data-save="${kind}"${list.length ? "" : " disabled"}>Save ${kind}</button>
      <span class="ad-status" id="ad-st-${kind}"></span>
    </div>
  </div>`;
}
function lastRunBlock(last, profile) {
  const profileBit = profile ? ` <span class="badge">plugin profile · ${esc(profile)}</span>` : "";
  if (!last) return `<div class="ad-run"><span class="dim">last run: honoured unknown · no recorded run for this agent</span>${profileBit}</div>`;
  const label = last.honoured === true ? "yes" : last.honoured === false ? "no" : "unknown";
  let evidence = last.evidence;
  if (typeof evidence === "string") evidence = evidence.split("\n").filter(l => l.trim());
  if (!Array.isArray(evidence)) evidence = [];
  return `<div class="ad-run">
    <span>last run honoured the selection: <b class="ad-honoured ${label}">${label}</b>${last.at ? ` <span class="dim">· ${esc(ago(last.at))}</span>` : ""}${profileBit}</span>
    ${last.reason ? `<span class="dim">${esc(last.reason)}</span>` : ""}
    ${evidence.length ? `<details><summary>evidence (${evidence.length} line${evidence.length===1?"":"s"})</summary><pre class="ad-evidence">${esc(evidence.join("\n"))}</pre></details>` : `<span class="dim">no evidence lines recorded</span>`}
  </div>`;
}
function renderAgentDrawer() {
  const d = AG.data || {};
  const detail = AG.detail || {};
  const a = detail.agent || {};
  $("#ad-ref").textContent = (a.slug || AG.slug || "") + (a.division_slug ? " · " + a.division_slug : "");
  $("#ad-title").textContent = (a.name || a.slug || AG.slug) + " · skills & plugins";
  $("#ad-body").innerHTML = `
    <div class="ad-mode">
      <span class="ad-note">Per-agent relevance: "a web development frontend skill is not required for a 3D game". Tick what this agent needs, then save each section.</span>
    </div>
    ${d.reason ? `<div class="ad-disc">${esc(d.reason)}</div>` : ""}
    ${renderToggleSection("Skills", "skills", d.skills)}
    ${renderToggleSection("Plugins", "plugins", d.plugins)}
    ${lastRunBlock(detail.last_run, a.plugin_profile)}
    <div class="ad-disc">plugin profile is edited in the Agents dialog (⋯ in the rail). Blank means inherit: use the global config as-is.</div>`;

  $("#ad-close").onclick = closeAgentDrawer;
  $("#ad-body").querySelectorAll("[data-save]").forEach(btn => {
    btn.onclick = () => saveSection(btn.dataset.save);
  });
}

async function saveSection(kind) {
  const slug = AG.slug;
  if (!slug || AG.busy || !AG.data) return;
  const rows = [...$("#ad-body").querySelectorAll(`input[data-kind="${kind}"]`)]
    .filter(input => !input.closest(".unavailable"));
  const payload = rows.map(input => ({ name: input.dataset.name, enabled: input.checked }));
  if (!payload.length) return;
  // The last state the server confirmed, for rollback when the save fails.
  const before = new Map((AG.data[kind] || []).map(item => [item.name, item.enabled !== false]));
  AG.busy = true;
  const buttons = [...$("#ad-body").querySelectorAll("[data-save]")];
  buttons.forEach(b => b.disabled = true);
  const status = $("#ad-st-" + kind);
  if (status) { status.className = "ad-status"; status.textContent = "saving…"; }
  try {
    const body = kind === "skills" ? { skills: payload } : { plugins: payload };
    const res = await api("/api/agents/" + encodeURIComponent(slug) + "/skills", { method: "PUT", body });
    if (AG.slug !== slug) return;
    AG.data = { ...AG.data, skills: res.skills || [], plugins: res.plugins || [], reason: res.reason || null };
    updateSummary(slug, AG.data);
    renderAgentDrawer();
    renderRail();
    const after = $("#ad-st-" + kind);
    if (after) { after.className = "ad-status ok"; after.textContent = "saved"; }
    toast(`${kind} saved`);
    load();   // refresh the agent card from the server after the save
  } catch (e) {
    if (AG.slug !== slug) return;
    // Roll the optimistic ticks back to the last state the server confirmed.
    $("#ad-body").querySelectorAll(`input[data-kind="${kind}"]`).forEach(input => {
      if (!input.closest(".unavailable") && before.has(input.dataset.name)) input.checked = before.get(input.dataset.name);
    });
    const st = $("#ad-st-" + kind);
    if (st) { st.className = "ad-status bad"; st.textContent = e.message; }
    toast(e.message, true);
  } finally {
    if (AG.slug === slug) {
      AG.busy = false;
      [...$("#ad-body").querySelectorAll("[data-save]")].forEach(b => {
        b.disabled = !b.closest(".ad-sec").querySelector(".tgl");
      });
    }
  }
}

    <div class="row2">
      <div class="field"><label>Slug</label><input id="nd-slug" placeholder="mobile-app"></div>

    <div>${ev.map(e => `<div class="evt"><b>${esc(e.kind)}</b><span>${esc(e.ticket_ref || "")} ${esc(e.message)}</span><span class="t">${ago(e.created_at)}</span></div>`).join("") || `<div class="empty">no events</div>`}</div>
    <div class="modal-actions"><button class="btn ghost" id="m-cancel">Close</button></div>`);

/* ---------------- wiring ---------------- */
$("#btn-new").onclick = newTicketModal;
$("#btn-agents").onclick = agentsModal;
$("#btn-add-div").onclick = addDivisionModal;

async function toggleDivisionPause(div) {
  if (!div) return;
  const resume = !!div.paused;
  try {
    await api(`/api/divisions/${encodeURIComponent(div.slug)}/pause`, { method: resume ? "DELETE" : "POST" });
    await load();
  } catch (e) {
    alert(`Could not ${resume ? "resume" : "pause"} ${div.slug}: ${e.message}`);
  }
}
$("#btn-events").onclick = eventsModal;
$("#btn-refresh").onclick = () => { load(); toast("refreshed"); };
$("#dr-close").onclick = closeDrawer;
$("#backdrop").onclick = closeDrawer;
$("#modal-wrap").onclick = (e) => { if (e.target.id === "modal-wrap") closeModal(); };

let focusKey = null;
function openFocus(kind) {
  const log = kind === "log";
  const el = $(log ? "#dr-log" : kind === "result" ? "#dr-result" : "#dr-desc");
  const src = log ? (el?.textContent || "") : (el?.innerText || "");
  if (!src.trim()) return;
  const key = kind + "|" + (S.openRef || "");
  if (focusKey === key && $("#focus-wrap").classList.contains("show")) return;   // same view: keep scroll
  focusKey = key;
  $("#focus-title").textContent = log ? "Agent output" : kind === "result" ? "Result" : "Description";
  $("#focus-ref").textContent = S.openRef || "";
  const body = $("#focus-body");
  body.className = "focus-body" + (log ? "" : " prose");
  body.textContent = src;
  body.scrollTop = log ? body.scrollHeight : 0;   // logs follow the tail, prose starts at the top
  $("#focus-wrap").classList.add("show");
}
function closeFocus(){ $("#focus-wrap").classList.remove("show"); focusKey = null; }
$("#focus-close").onclick = closeFocus;
$("#focus-copy").onclick = async () => {
  const b = $("#focus-copy");
  try { await navigator.clipboard.writeText($("#focus-body").textContent); b.textContent = "copied"; }
  catch { b.textContent = "copy failed"; }
  setTimeout(() => (b.textContent = "copy"), 1200);
};
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-focus]");
  if (btn) { e.preventDefault(); openFocus(btn.dataset.focus); return; }
  const ref = e.target.closest("[data-ref]");
  if (ref) { e.preventDefault(); openTicket(ref.dataset.ref); return; }
  if (e.target.id === "focus-wrap") closeFocus();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if ($("#agent-drawer").classList.contains("show")) { closeAgentDrawer(); return; }
  closeFocus();
});

// drawer width: drag the left edge, remember it, double-click to go full width
const DRW_KEY = "bureau_drawer_w";
const drawerEl = $("#drawer");
const clampW = (w) => Math.max(420, Math.min(w, innerWidth * 0.98));
const setDrawerWidth = (w) => { drawerEl.style.width = clampW(w) + "px"; };
try { const saved = Number(localStorage.getItem(DRW_KEY)); if (saved > 0) setDrawerWidth(saved); } catch {}
let dragFrom = null;
$("#grip").addEventListener("pointerdown", (e) => {
  dragFrom = { x: e.clientX, w: drawerEl.getBoundingClientRect().width };
  e.target.setPointerCapture(e.pointerId);
  document.body.classList.add("dragging");
  e.preventDefault();
});
$("#grip").addEventListener("pointermove", (e) => {
  if (!dragFrom) return;
  setDrawerWidth(dragFrom.w + (dragFrom.x - e.clientX));
});
const endDrag = () => {
  if (!dragFrom) return;
  dragFrom = null;
  document.body.classList.remove("dragging");
  try { localStorage.setItem(DRW_KEY, String(Math.round(drawerEl.getBoundingClientRect().width))); } catch {}
};
$("#grip").addEventListener("pointerup", endDrag);
$("#grip").addEventListener("pointercancel", endDrag);
$("#grip").addEventListener("dblclick", () => {
  const wide = drawerEl.getBoundingClientRect().width >= innerWidth * 0.9;
  setDrawerWidth(wide ? 720 : innerWidth * 0.97);
  try { localStorage.setItem(DRW_KEY, String(Math.round(drawerEl.getBoundingClientRect().width))); } catch {}
});
addEventListener("resize", () => setDrawerWidth(drawerEl.getBoundingClientRect().width));

$("#search").oninput = (e) => { S.q = e.target.value.toLowerCase().trim(); saveView(); renderBoard(); };
$("#btn-done").onclick = () => { S.showDone = !S.showDone; renderBoard(); writeStateToUrl(false); };
$("#btn-tick").onclick = async () => {
  if (S.busy) return;
  S.busy = true; $("#btn-tick").textContent = "dispatching…";
  try {
    const r = await api("/api/dispatch/tick", {method:"POST"});
    toast(r.status === "busy" ? "a dispatch pass is already running" : "dispatch pass started");
  } catch (e) { toast(e.message, true); }
  setTimeout(async () => { S.busy = false; $("#btn-tick").textContent = "▶ Run dispatch tick"; await load(); }, 900);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeDrawer(); }
  const typing = ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
  if (typing) return;
  if (e.key === "n") { e.preventDefault(); newTicketModal(); }
  if (e.key === "/") { e.preventDefault(); $("#search").focus(); }
  if (e.key === "r") { load(); }
});

// Back/forward (and a hand-edited hash): mirror the URL into the board without writing it back.
async function applyUrlState() {
  if (applyingUrl) return;
  applyingUrl = true;
  try {
    const st = hashState();
    const div = st.div || "all";
    const done = st.done === "1";
    const rail = div !== S.division;
    const board = rail || done !== S.showDone;
    if (rail) S.division = div;
    S.showDone = done;
    if (rail) renderRail();
    if (board) renderBoard();
    if (st.ref && st.ref !== S.openRef) await openTicket(st.ref, { silent: true, restore: true });
    else if (!st.ref && S.openRef) closeDrawer({ silent: true });
    saveView();
  } finally { applyingUrl = false; }
}
addEventListener("popstate", applyUrlState);
addEventListener("hashchange", applyUrlState);

readStateFromUrl();
load().then(async () => {
  if (S.snap && S.division !== "all" && !S.snap.divisions.some(d => d.slug === S.division)) {
    S.division = "all"; renderRail(); renderBoard();
  }
  const ref = S.openRef;
  if (ref) await openTicket(ref, { silent: true, restore: true });
  writeStateToUrl(false, true);   // normalise the address bar (and drop a ref that just 404'd)
});
S.timer = setInterval(() => { if (!document.hidden) load(); }, 4000);
</script>
