[package]
name = "bureau"
version = "0.6.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chacha20poly1305 = { version = "0.10.1", features = ["std"], optional = true }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.1.4", features = ["json"] }

[features]
# Key encryption for provider credentials. On by default; a build without it
# refuses to store an API key rather than falling back to plaintext.
default = ["keys"]
keys = ["dep:chacha20poly1305"]

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
